issue       = 1
pages       = "52-57"
year        = 1985
doi         = "10.1021/j100247a015"
notes       = "Rational-function optimization (RFO): the augmented-Hessian eigenvector-following step that shifts the Newton-Raphson update by the lowest (minimum search) or partitioned (saddle search) eigenvalue of the RFO matrix. The foundation of vibeqc.geomopt.trust.rfo and the eigenvector-following / P-RFO transition-state optimizers (geomopt.ts). Fires via routes.optimizers for geom_opt in {rfo, ef, prfo}."

