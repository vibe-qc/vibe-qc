# madelung_wire_1d), for every adapter; never for the "none" family and
# never for the self-consistent ewald_gamma family.
"ccm_madelung_embedding" = ["bredow_geudtner_jug_ccm_2001", "janetzko_ccm_long_range_2002", "ewald_lattice_sum_1921"]
# The MSINDO engine's frozen 1-D kernel (madelung_truncated_1d): the finite
