year        = 1983
doi         = "10.1103/PhysRevB.28.5781"
notes       = "The bielectronic-zone / monoelectronic-zone partition of the periodic Coulomb series: Eq. (24a) rearranges the Fock Coulomb contribution into a penetration-bounded exact zone plus an infinite multipolar (Ewald-evaluated) model series, with the exact zone selected by adjoined-Gaussian penetration (the ITOL2 ancestry) and L >= 4 multipole truncation making the result partition-independent (Sec. IV.A, Table III). vibe-qc's BIPOLE exact_zone_bohr restriction (pbc_bipole_fock._sr_image_padded_jk; resolve_bipole_exact_zone) implements this zone structure in the Ewald-split gauge, where the reciprocal J_LR channel plays the role of the multipolar model series. Fires on routes.jk_methods.bipole."

[entries.causa_exchange_truncation_1988]
kind        = "article"
