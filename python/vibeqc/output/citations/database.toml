# vibe-qc citation database — single source of truth.
#
# Every method, functional, basis set, ECP, dispersion model, and
# third-party linked library that ships in vibe-qc has an entry here.
# At runtime, `vibeqc.output.citations.assemble(plan)` walks the
# [routes.*] tables and produces the ordered, deduplicated reference
# list for a job's .out / .bibtex / .references files.
#
# When you add or rename a feature in vibe-qc, you must update this
# file in the SAME merge (see AGENTS.md § "Citation database
# ownership"). CI fails when the registered methods / functionals /
# basis sets diverge from what is routed here.
#
# Coverage as of v0.8.0-on-main. The basissetdev branch carries an
# additional sibling `database_basissetdev.toml` for the 87 BSE-fetched
# basis sets that do not ship on main (CLAUDE.md § 4).

schema_version = "1"


# ====================================================================
# REFERENCE ENTRIES
# ====================================================================
# Each [entries.<key>] block is one citable reference. The key is
# referenced from routes below and from `bibtex_key` for BibTeX output.
#
# Required fields:
#   kind        — "software" | "article" | "book" | "phdthesis" | "misc"
#   bibtex_key  — used as the BibTeX entry key in the .bibtex file
#   authors     — list of "Family, Given" strings
#   title       — title of the work
#
# Optional fields (use as appropriate to `kind`):
#   journal, volume, issue, pages, publisher, year, doi, url, notes,
#   version, license
#   role        — what the entry is cited *for* on the routes that fire
#                 it, when a route mixes provenance kinds:
#                 "parameter-source" (the published table the shipped
#                 numbers were transcribed from) or "method" (the
#                 formalism paper). Free text otherwise unused by the
#                 renderers; tests pin the OMx split (#272).


# --- vibe-qc software itself ----------------------------------------
[entries.vibeqc_software]
kind        = "software"
bibtex_key  = "peintinger_vibeqc"
authors     = ["Peintinger, Michael F."]
title       = "vibe-qc: a quantum-chemistry code for molecules and solids"
year_template   = "{{VIBEQC_YEAR}}"
version_template = "{{VIBEQC_VERSION}}"
license     = "MPL-2.0"
url         = "https://vibe-qc.com/"
notes       = "Always cite. A peer-reviewed publication is forthcoming; this software citation is the canonical reference until then."


