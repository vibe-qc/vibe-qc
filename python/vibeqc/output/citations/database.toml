# fires *in addition* for the well-tempered variant. Wired via
# uses_metadynamics / well_tempered.
"metadynamics"          = ["laio_parrinello_metadynamics_2002"]
"well_tempered_metadynamics" = ["barducci_well_tempered_2008"]
# Linear-response TDDFT (python/vibeqc/tddft.py). ``tddft`` fires the
# Runge-Gross theorem + Casida formalism for any run_tddft_* call; the
# ``tddft_tda`` row fires *in addition* (Hirata-Head-Gordon 1999) when the
# Tamm-Dancoff approximation is used, and the ``tddft_hybrid`` row fires
# *in addition* (Bauernschmitt-Ahlrichs 1996) when the response kernel
# carries a hybrid's exact-exchange admixture. Wired via uses_tddft /
# tddft_variant / tddft_hybrid_kernel.
"tddft"                 = ["runge_gross_1984", "casida_tddft_1995"]
