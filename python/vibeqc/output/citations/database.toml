doi         = "10.1063/1.480097"
notes       = "The dimer method — single-ended first-order saddle-point search using only first derivatives (forces). A dimer of two images is rotated to the lowest-curvature mode then translated uphill along it. Fires via routes.drivers.dimer for any ``vibeqc.run_dimer`` invocation."

[entries.fukui_irc_1981]
