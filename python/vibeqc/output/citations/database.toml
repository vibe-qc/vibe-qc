issue       = 22
pages       = "9978-9985"
year        = 2000
doi         = "10.1063/1.1323224"
notes       = "Improved-tangent NEB. The energy-ordering tangent estimator (eqs. 8-11) that ``vibeqc.run_neb`` uses to project spring forces and perpendicular true-gradient components. Cite alongside Smidstrup 2014 (IDPP) whenever ``vibeqc.run_neb`` is used."

[entries.henkelman_uberuaga_jonsson_ci_neb_2000]
kind        = "article"
bibtex_key  = "henkelman_uberuaga_jonsson_ci_neb_2000"
authors     = ["Henkelman, Graeme", "Uberuaga, Blas P.", "Jónsson, Hannes"]
