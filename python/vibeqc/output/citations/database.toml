journal     = "The Journal of Physical Chemistry"
volume      = 92
pages       = "909--913"
year        = 1988
doi         = "10.1021/j100315a010"
notes       = "Convergence and truncation analysis of the periodic exact-exchange series: the exchange sum has no opposite-sign counterpart and must converge by itself (density-matrix decay, exponential in insulators with constant ~ W/(W+G)); asymmetric g/n truncation is variationally exploitable (the ITOL5 >> ITOL4 rule), and long-range exchange shifts the total energy while leaving the wavefunction essentially unaltered. Background for the BIPOLE exchange truncation ordering: the density support (2x cutoff) always exceeds the exact-exchange output zone, including under exact_zone_bohr. Fires on routes.jk_methods.bipole."

