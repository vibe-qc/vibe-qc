# ====================================================================
# ROUTING RULES
# ====================================================================
# Each [routes.<category>] maps from "what the user requested" to
# "which entries fire". The `always` list is unconditional for the
# category; per-key entries fire when the matching string is seen.
#
# Lookups are case-insensitive — keys here are lowercased and the
# runtime registry normalises the lookup value the same way.
#
# When you add a new functional / basis / method to vibe-qc, you MUST
# add it to the matching routes table in the same merge (see AGENTS.md).


[routes.software]
always = ["vibeqc_software"]
"jarvis_dft"            = ["jarvis_dft"]


[routes.integrals]
always = ["libint_valeev"]


[routes.basis_sets]
# Not a basis name: the Basis Set Exchange provenance for the bundled library.
# registry.assemble() fires this alongside any basis that resolves to a routed
# (i.e. bundled) entry, so a job that draws a bundled basis cites the catalog it
