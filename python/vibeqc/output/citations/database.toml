notes       = "Section 4 'Truncation Criteria' (p. 508) defines the overlap-magnitude criterion that every periodic Gaussian LCAO code truncates its real-space lattice sums on: a shell pair is retained when the overlap of the two shells' s-type adjoined Gaussians -- each carrying the SMALLEST exponent of its contraction -- exceeds a tolerance (CRYSTAL's ITOL1 = -log10 S_c). vibe-qc implements it as vibeqc.lattice_screening.estimate_rcut_overlap_pair, which sizes the Bloch overlap lattice sum so that S(k) = sum_R exp(i k . R) S(R) stays positive definite; a flat geometric radius does not, and the failure is invisible at the zone centre. Fires with the periodic-LCAO monograph on any periodic job."

