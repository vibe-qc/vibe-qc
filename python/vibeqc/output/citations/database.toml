[routes.solvation]
# Solvent-model citations. Fired when the ``solvent`` kwarg is
# passed to ``run_job`` (or ``run_cpcm_scf`` is called directly).
# Both ``cpcm`` and ``cosmo`` variants share the same three-paper
# bundle today — vibe-qc implements CPCM with the COSMO scaling and
# the Scalmani-Frisch CSC diagonal element.
"cpcm"                  = ["klamt_schuurmann_cosmo_1993", "cossi_cpcm_2003", "scalmani_frisch_csc_2010", "tomasi_continuum_review_2005", "lange_herbert_swig_2010"]
"cosmo"                 = ["klamt_schuurmann_cosmo_1993", "cossi_cpcm_2003", "scalmani_frisch_csc_2010", "tomasi_continuum_review_2005", "lange_herbert_swig_2010"]
# MSINDO COSMO on its native GEPOL/SAS cavity (msindo_cosmo cavity="gepol").
# Klamt COSMO model + CPCM matrix layout + the GEPOL cavity paper + the review;
# NOT the Scalmani-Frisch CSC diagonal or Lange SWIG switching (those are the
# Lebedev-cavity treatment used by the "cosmo"/"cpcm" Lebedev path).
"cosmo_gepol"           = ["klamt_schuurmann_cosmo_1993", "cossi_cpcm_2003", "silla_gepol_1991", "tomasi_continuum_review_2005"]
# Direct COSMO-RS (SolventModel variant="dcosmo-rs"; Sinnecker et al. 2006).
# One solvation row fires per variant, so this row is the whole calculation:
# the method paper, the COSMO-RS sigma potential and its parameterization, the
# conductor COSMO it corrects, and the COSMO FINE Cavity the variant requires
# with that cavity's Gaussian-charge diagonal (Lange & Herbert eq. 3.7). NOT
# Scalmani-Frisch: its point-charge diagonal is the Lebedev cavity's, which
# Direct COSMO-RS refuses.
"dcosmo-rs"             = ["sinnecker_direct_cosmors_2006", "klamt_schuurmann_cosmo_1993", "klamt_cosmors_1995", "klamt_cosmors_parametrization_1998", "klamt_fine_cavity_2018", "cossi_cpcm_2003", "lange_herbert_swig_2010", "tomasi_continuum_review_2005"]
# COSMO-RS / COSMOSPACE thermodynamics (vibeqc.solvation.cosmors). Fires when
# a job computes a sigma profile, sigma potential, chemical potential or any
# property derived from them. The underlying COSMO surface cites its own
# electrostatics separately through the "cosmo"/"cpcm" routes above; these two
# are the statistical-thermodynamics layer on top of it.
"cosmors"               = ["klamt_cosmors_1995", "klamt_cosmors_parametrization_1998", "klamt_schuurmann_cosmo_1993"]
# COSMOSPACE: the exact surface-pair activity-coefficient equation. Fires in
# addition to the "cosmors" route when a job uses the COSMOSPACE solver rather
# than the independent-patch sigma potential.
"cosmospace"            = ["klamt_cosmospace_2002", "klamt_cosmors_1995", "klamt_cosmors_parametrization_1998"]
# The COSMO FINE Cavity. Fires when a job builds its cavity with the
# pseudo-density iso-surface construction rather than the Lebedev union of
# atomic spheres.
"fine_cavity"           = ["klamt_fine_cavity_2018", "klamt_schuurmann_cosmo_1993"]

