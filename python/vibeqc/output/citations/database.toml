# The intrinsic reaction coordinate (mass-weighted steepest-descent path
# following) fires for any ``vibeqc.run_irc`` invocation: the IRC concept
# (Fukui 1981) + the stabilized steepest-descent integrator (IMK 1977).
"irc"                   = ["fukui_irc_1981", "ishida_morokuma_komornicki_irc_1977"]
# Molecular dynamics (vibeqc.md). ``md`` fires the velocity-Verlet
# integrator for any run_md call (every ensemble); the thermostat rows
# fire *in addition* via the md_thermostat selector. Wired via uses_md /
# md_thermostat.
"md"                    = ["swope_velocity_verlet_1982"]
