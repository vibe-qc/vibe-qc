# 1-D background-corrected Parry-type wire Ewald (cpp/src/semiempirical/
# seccm/ewald_1d.h): fires for SECCM 1-D runs whose electrostatics kernel
# resolves to *_wire_1d (madelung and ewald_gamma families alike); the
# parry entry's notes already document the wire split's provenance.
# NOT the MSINDO engine: its 1-D kernel is the frozen truncated +/-2-shell
# bare lattice sum (indo::_madelung_potential_1d) that the wire Ewald
# replaced, and it carries the distinct *_truncated_1d kernel name so this
# route cannot credit Parry 1975 to it (GitLab #442).
"wire_ewald_1d"         = ["parry_2d_ewald_1975"]
# CCM Madelung/Ewald embedding (Bredow-Geudtner-Jug 2001 construction with
