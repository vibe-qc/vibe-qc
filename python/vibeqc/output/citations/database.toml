# ====================================================================
# Nudged Elastic Band (NEB) — path-construction + driver
# ====================================================================
# Entries land per-increment with the code that introduces them:
#   * Increment 1 — IDPP interpolation (Smidstrup 2014).
#   * Increment 2 — improved-tangent NEB (Henkelman+Jónsson 2000).
#   * Increment 3 — climbing-image NEB (Henkelman+Uberuaga+Jónsson 2000).
# The ``vibeqc.run_neb`` driver passes ``uses_neb=True`` (set when the
# driver finishes; the per-image SCF jobs cite their own method /
# functional / basis as usual). Both NEB-paper entries fire whenever
# the user invokes ``run_neb`` — the driver always uses the
# improved-tangent estimator + IDPP-default interpolation.

[entries.smidstrup_idpp_2014]
kind        = "article"
bibtex_key  = "smidstrup_idpp_2014"
authors     = ["Smidstrup, Søren", "Pedersen, Andreas", "Stokbro, Kurt", "Jónsson, Hannes"]
title       = "Improved initial guess for minimum energy path calculations"
journal     = "Journal of Chemical Physics"
volume      = 140
issue       = 21
pages       = "214106"
year        = 2014
doi         = "10.1063/1.4878664"
notes       = "Image-Dependent Pair Potential (IDPP) interpolation used by ``vibeqc.interpolate_idpp`` and (by default) by ``vibeqc.run_neb`` to construct the initial path. Strictly improves over linear Cartesian interpolation when reactant/product differ in bonding by avoiding atom-atom clashes in intermediate images."

[entries.henkelman_jonsson_neb_2000]
kind        = "article"
bibtex_key  = "henkelman_jonsson_neb_2000"
authors     = ["Henkelman, Graeme", "Jónsson, Hannes"]
