pages       = "9901-9904"
year        = 2000
doi         = "10.1063/1.1329672"
notes       = "Climbing-image NEB (CI-NEB). The highest-energy intermediate image's spring contribution is dropped and the tangent-parallel component of its true force is inverted so it climbs uphill to the saddle while still relaxing perpendicular. Cite in addition to Henkelman+Jónsson 2000 + Smidstrup 2014 whenever ``vibeqc.run_neb(..., climbing_image=True)`` is used."

[entries.henkelman_jonsson_dimer_1999]
