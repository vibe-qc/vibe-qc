volume      = 110
pages       = "2235--2245"
year        = 2006
doi         = "10.1021/jp056016z"
notes       = "The Direct COSMO-RS method: the COSMO-RS sigma potential of a real solvent fed back into the SCF as extra screening charges (eq. 18-19), implemented in vibeqc.solvation.cosmors.direct and selected by SolventModel(variant=\"dcosmo-rs\"). The paper states the operator, not the energy; vibe-qc's G = E_gas[D] + (1/2) q.V_tot + sum_t a_t mu_S(sigma_t) is derived so that its density derivative is that operator."

[entries.cossi_cpcm_2003]
