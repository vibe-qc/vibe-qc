# ====================================================================
# Implicit solvation (CPCM / COSMO)
# ====================================================================
# vibe-qc's CPCM macro-iteration (vibeqc.solvation.run_cpcm_scf) couples
# the gas-phase SCF to a conductor-screening apparent-surface-charge
# model. Three papers establish the formulation actually used here:
# the original COSMO conductor model, the CPCM matrix layout, and the
# Scalmani-Frisch continuous-surface-charge diagonal element. All three
# are cited together whenever ``solvent`` is passed to run_job (or
# run_cpcm_scf is called directly).

[entries.klamt_schuurmann_cosmo_1993]
kind        = "article"
bibtex_key  = "klamt_schuurmann_cosmo_1993"
authors     = ["Klamt, Andreas", "Schüürmann, Gerrit"]
title       = "COSMO: a new approach to dielectric screening in solvents with explicit expressions for the screening energy and its gradient"
journal     = "Journal of the Chemical Society, Perkin Transactions 2"
issue       = 5
pages       = "799--805"
year        = 1993
doi         = "10.1039/P29930000799"
notes       = "Original COSMO conductor-screening model. Defines the screening family f(ε) = (ε−1)/(ε+x) (p. 800) and the COSMO member x = 1/2 (p. 801), and states that f(ε) enters the screening energy AND its gradient — the convention vibeqc.solvation.screening carries. Note (ε−1)/ε is the CPCM member x = 0, due to Cossi 2003, not this paper."

[entries.klamt_cosmors_1995]
kind        = "article"
bibtex_key  = "klamt_cosmors_1995"
authors     = ["Klamt, Andreas"]
title       = "Conductor-like Screening Model for Real Solvents: A New Approach to the Quantitative Calculation of Solvation Phenomena"
journal     = "The Journal of Physical Chemistry"
volume      = 99
issue       = 7
pages       = "2224--2235"
year        = 1995
doi         = "10.1021/j100007a062"
notes       = "Derives COSMO-RS: the sigma-profile description of an ensemble of ideally screened molecules, and the misfit interaction energy. The theory vibeqc.solvation.cosmors implements."

[entries.klamt_fine_cavity_2018]
kind        = "article"
bibtex_key  = "klamt_fine_cavity_2018"
authors     = ["Klamt, Andreas", "Diedenhofen, Michael"]
title       = "A refined cavity construction algorithm for the conductor-like screening model"
journal     = "Journal of Computational Chemistry"
volume      = 39
issue       = 21
pages       = "1648--1655"
year        = 2018
doi         = "10.1002/jcc.25342"
notes       = "Defines the COSMO FINE Cavity (CFC): the pseudo-density iso-surface of eq. 8 triangulated by marching tetrahedra, implemented in vibeqc.solvation.fine_cavity. Also the source for the screening family f(ε) = (ε−1)/(ε+x) with x = 1/2 for neutral compounds and x = 0 for ions (eq. 2), and for the COSMO gradient's (0.5/f(ε)) cavity term (eq. 7)."

[entries.klamt_cosmospace_2002]
kind        = "article"
bibtex_key  = "klamt_cosmospace_2002"
authors     = ["Klamt, Andreas", "Krooshof, Gerard J. P.", "Taylor, Ross"]
title       = "COSMOSPACE: Alternative to conventional activity-coefficient models"
journal     = "AIChE Journal"
volume      = 48
issue       = 10
pages       = "2332--2349"
year        = 2002
doi         = "10.1002/aic.690481023"
notes       = "Exact statistical thermodynamics of an ensemble of pairwise interacting surface segments, replacing COSMO-RS's independent-patch approximation. Supplies the COSMOSPACE equation (eq. 16), the exchange factor (eq. 17), the residual activity coefficient (eq. 13) and the closed-form binary solution (eq. 19) implemented in vibeqc.solvation.cosmors.cosmospace."

[entries.klamt_cosmors_parametrization_1998]
kind        = "article"
bibtex_key  = "klamt_cosmors_parametrization_1998"
authors     = ["Klamt, Andreas", "Jonas, Volker", "Bürger, Thorsten", "Lohrenz, John C. W."]
title       = "Refinement and Parametrization of COSMO-RS"
journal     = "The Journal of Physical Chemistry A"
volume      = 102
issue       = 26
pages       = "5074--5085"
year        = 1998
doi         = "10.1021/jp980017s"
notes       = "Supplies the sigma-averaging algorithm (eq. 11), the correlation descriptor (eq. 14), the misfit and hydrogen-bond energies (eq. 22, 26), the self-consistent sigma potential (eq. 17/18) and its segment form (eq. 23–25), the chemical potentials (eq. 19–21) and the combinatorial term (eq. 30). Section 5.1 is the source of the klamt1998 parameterization in vibeqc.solvation.cosmors.parameters, which was fitted against DMol/BPW91/DNP with COSMO at f(ε)=1 and NSPA=92 segments."

[entries.sinnecker_direct_cosmors_2006]
kind        = "article"
bibtex_key  = "sinnecker_direct_cosmors_2006"
authors     = ["Sinnecker, Sebastian", "Rajendran, Arivazhagan", "Klamt, Andreas", "Diedenhofen, Michael", "Neese, Frank"]
