# --- Geometry-optimization algorithms (vibeqc.geomopt) --------------
# The keyword-selectable optimizers / coordinate systems of the uniform
# geometry-optimization framework (vibeqc.geomopt, run_job(geom_opt=...,
# geom_coords=...)). Each defining paper fires via routes.optimizers /
# routes.coordinates when the matching optimizer / coordinate system
# actually drives a relaxation (CLAUDE.md § 8). Steepest-descent /
# conjugate-gradient / (L-)BFGS carry no row here -- they are textbook /
# already covered by the Pulay-forces gradient route + the ASE BFGS
# citation.
[entries.banerjee_rfo_1985]
kind        = "article"
