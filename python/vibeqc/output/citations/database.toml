notes       = "Baker's eigenvector-following / partitioned-RFO (P-RFO) algorithm with Hessian mode-following for saddle-point location, built on the Banerjee 1985 RFO step. Implemented in vibeqc.geomopt.ts (eigenvector_following + partitioned_rfo). Fires via routes.optimizers for geom_opt in {ef, prfo}, alongside Banerjee 1985."

