[metadata]
name = "minix"
kind = "gcp_parameters"
citation = "Sure & Grimme, J. Comput. Chem. 34, 1672 (2013)"
doi = "10.1002/jcc.23317"
license = "Open data: numerical results from a published scientific paper; redistribution is standard practice"
source = "mctc-gcp src/gcp.f90 case 'hf3c'/'minix': (sigma,eta,alpha,beta)=(0.129,1.1526,1.1549,1.1763); e_mis from the composite HFminis/HFminisd/HFsv/HFsvp (+ Li-Be/Na-Mg p-augmentation); n_virt = xva = nbas - 0.5*nel where nbas is the MINIX composite count. HF-3c gCP is UNDAMPED (gcp.f90 hf3c: base=.true. adds the SRB, damp=.false.). Cross-verified against mctc-gcp, github.com/grimme-lab/gcp."
status = "complete"
coverage = "H–Kr (Z=1..36)"
note = """
MINIX = MINIS for H-Mg + MINIS+d for Al-Ar + SV for K-Zn + SVP for Ga-Kr, with p-augmentation on Li/Be/Na/Mg. CRITICAL (audit F1.5): n_virt are the mctc-gcp virtual counts xva = nbas - 0.5*nel, NOT raw nbas — the original bundling stored raw nbas, giving gCP(H2O,hf-3c) = +12.7 vs the correct +18.33 kcal/mol. With nbas-0.5*Z the hf-3c gCP(H2O) = +18.327 kcal/mol, matching mctc-gcp's gcp_call('hf3c') minus the SRB term. e_mis is unchanged.
"""

[parameters]
sigma = 0.129
eta   = 1.1526
alpha = 1.1549
beta  = 1.1763

