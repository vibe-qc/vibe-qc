[metadata]
name = "def2-svp"
kind = "gcp_parameters"
citation = "Kruse & Grimme, J. Chem. Phys. 136, 154101 (2012)"
doi = "10.1063/1.3700154"
license = "Open data: numerical results from a published scientific paper; redistribution is standard practice"
source = "mctc-gcp src/gcp.f90 case 'hf/svp' (HFsvp + BASsvp data blocks); cross-verified against mctc-gcp Fortran reference implementation, github.com/grimme-lab/gcp"
status = "complete"
coverage = "H–Kr (Z=1..36)"
note = """
Canonical def2-SVP gCP fit from the Kruse-Grimme 2012 paper. Use with HF or B3LYP at def2-SVP. For DFT-specific damping use case 'dft/svp' instead (different p constants).
"""

