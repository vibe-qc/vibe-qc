<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="vibe-qc">
  <title>vibe-qc</title>
  <defs>
    <linearGradient id="aLobeFront" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="aLobeBack" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#0B6A63"/>
    </linearGradient>
    <style>
      .wm { font-family: "Sora", "Manrope", "Söhne", "Helvetica Neue", Arial, sans-serif; font-weight: 600; letter-spacing: -0.02em; }
    </style>
  </defs>

  <!-- ICON: p-orbital with wave threading through the node -->
  <g transform="translate(40,70)">
    <ellipse cx="172" cy="80" rx="60" ry="34" fill="url(#aLobeBack)" opacity="0.9"/>
    <ellipse cx="68" cy="80" rx="60" ry="34" fill="url(#aLobeFront)"/>
    <path d="M -10 80 C 20 30, 50 130, 80 80 C 110 30, 140 130, 170 80 C 200 30, 230 130, 260 80"
          fill="none" stroke="#0B1220" stroke-width="6" stroke-linecap="round"/>
    <circle cx="120" cy="80" r="4.5" fill="#0B1220"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(340,0)">
    <text x="0" y="195" class="wm" font-size="172" fill="#0B1220">vibe</text>
    <g transform="translate(380,128)">
      <path d="M 0 0 q 14 -22 28 0 t 28 0" fill="none" stroke="#14B8A6" stroke-width="12" stroke-linecap="round"/>
    </g>
    <text x="470" y="195" class="wm" font-size="172" fill="#0B1220">qc</text>
  </g>
</svg>
