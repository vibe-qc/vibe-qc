include:
  - project: '$VIBEQC_CI_PROJECT'
    ref: '$VIBEQC_CI_REF'
    file: '$VIBEQC_CI_FILE'
    rules:
      - if: '$VIBEQC_CI_PROJECT && $VIBEQC_CI_REF && $VIBEQC_CI_FILE'
  # A partial external configuration must fail validation, not omit deployment.
  # This sentinel file deliberately does not exist in the product repository.
  - local: '/.incomplete-external-ci-configuration.yml'
    rules:
      - if: '($VIBEQC_CI_PROJECT || $VIBEQC_CI_REF || $VIBEQC_CI_FILE) && ($VIBEQC_CI_PROJECT == null || $VIBEQC_CI_PROJECT == "" || $VIBEQC_CI_REF == null || $VIBEQC_CI_REF == "" || $VIBEQC_CI_FILE == null || $VIBEQC_CI_FILE == "")'

# Portable build and validation rules. Site deployment jobs are maintained separately.
stages:
  - privacy
  - test
  - build
  - deploy

variables:
  QVF_TAG: "v0.1.0-docs.1"
  VIBE_VIEW_TAG: "v2.20.1"
  VIBEQC_RELEASE_BASE: "v0.17.11"

workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_COMMIT_BRANCH =~ /^release-candidate\//'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: &website_paths
        - "website/**/*"
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

source-privacy:
  interruptible: true
  stage: privacy
  image: python:3.13-slim-bookworm
  tags:
    - docker
  before_script:
    - apt-get -qq update && apt-get -qq install -y --no-install-recommends git
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python .githooks/source_privacy.py --tree "$CI_COMMIT_SHA"
    - python -m unittest discover -s .githooks -p "test_privacy*.py"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_BRANCH =~ /^release-candidate\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

ci-path-policy:
  interruptible: true
  stage: test
  image: python:3.13-slim-bookworm
  tags:
    - docker
  script:
    - python scripts/ci/path_policy.py
      --verify-gitlab --verify-build-cache --show-cases
    - python -m unittest discover -s scripts/ci/tests -p "test_*.py"
    - python -m compileall -q python/vibeqc python/vibeqc_naming tests scripts/test_gate
    - python scripts/test_gate/run_full_suite.py --wt . --tier T1 --dry-run
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_BRANCH =~ /^release-candidate\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Source-only regression: no Python extension or full dependency rebuild.
native-regressions:
  stage: test
  image: python:3.13-slim-bookworm
  interruptible: true
  tags:
    - docker
  timeout: 15m
  before_script:
    - apt-get -qq update && apt-get -qq install -y --no-install-recommends cmake make g++ libeigen3-dev libint2-dev
  script:
    - cmake -S tests/native -B build-native-regressions -DCMAKE_BUILD_TYPE=Release
    - cmake --build build-native-regressions --parallel 2
    - ctest --test-dir build-native-regressions --output-on-failure
  rules:
    - if: '$VIBEQC_FULL_VALIDATION == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &native_regression_paths
        - ".gitlab-ci.yml"
        - "cpp/src/trah.cpp"
        - "cpp/src/quadratic_scf.cpp"
        - "cpp/include/vibeqc/**/*"
        - "tests/native/**/*"
        - "tests/test_trah_noncanonical.cpp"

build-test:
  stage: test
  image: python:3.13-slim-bookworm
  resource_group: native-build-test
  interruptible: true
  tags:
    - docker
  timeout: 12h
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    CCACHE_DIR: $CI_PROJECT_DIR/.cache/ccache
    CCACHE_BASEDIR: $CI_PROJECT_DIR
    CCACHE_COMPILERCHECK: content
    CCACHE_NOHASHDIR: "true"
    CCACHE_MAXSIZE: 2G
    VIBEQC_BUILD_LOCK: "0"
  cache:
    - key:
        files:
          - scripts/build_libint.sh
          - scripts/build_libxc.sh
        prefix: third-party-debian12-gcc12
      paths:
        - third_party/*/install/
      when: always
    - key: vibeqc-core-debian12-gcc12-python313-cp313-linux-x86_64-release-v1
      paths:
        - build/
        - .cache/ccache/
      when: on_success
    - key: pip-build-python313-${CI_COMMIT_REF_SLUG}
      paths:
        - .cache/pip/
  before_script:
    - apt-get -qq update && apt-get -qq install -y --no-install-recommends
      build-essential ccache cmake ninja-build pkg-config gfortran
      git curl tar ca-certificates
      libboost-dev libeigen3-dev libgmp-dev libopenblas-dev
  artifacts:
    name: build-test-diagnostics-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
    when: always
    expire_in: 2 weeks
    paths:
      - third_party/*/build.log
      - blocking.jsonl
      - test-results/native-runtime.json
      - test-results/native-core/
      - test-results/viewer-contract.xml
    reports:
      junit: test-results/viewer-contract.xml
  script:
    - unset VIBEQC_ALLOW_STALE_CORE
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
    - df -h "$CI_PROJECT_DIR" | tail -n 2 && head -n 3 /proc/meminfo
    - >-
      if [ "${VIBEQC_FULL_VALIDATION:-0}" = 1 ] || printf '%s' "${CI_COMMIT_BRANCH:-}" | grep -Eq '^release-candidate/';
      then
        export SKBUILD_BUILD_DIR="$CI_PROJECT_DIR/build-clean/$CI_PIPELINE_ID";
        export CCACHE_DISABLE=1;
        echo "native build mode: clean ($SKBUILD_BUILD_DIR; ccache disabled)";
        bash scripts/install.sh --current --extras test --venv .venv;
      else
        echo "native build mode: incremental (build/{wheel_tag}; ccache enabled)";
        ccache --zero-stats;
        bash scripts/install.sh --current --extras test --venv .venv;
      fi;
      if [ -z "${CCACHE_DISABLE:-}" ]; then ccache --show-stats; fi
    - |
      .venv/bin/python - <<'PY'
      import hashlib, json, os, shutil, subprocess, sys, tomllib
      from pathlib import Path
      import vibeqc
      from vibeqc import _vibeqc_core
      from vibeqc.banner import library_versions
      root = Path(os.environ["CI_PROJECT_DIR"]).resolve()
      package = Path(vibeqc.__file__).resolve()
      core = Path(_vibeqc_core.__file__).resolve()
      sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
      version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
      assert not os.environ.get("VIBEQC_ALLOW_STALE_CORE"), "stale-core override enabled"
      assert sha == os.environ["CI_COMMIT_SHA"], (sha, os.environ["CI_COMMIT_SHA"])
      assert package.is_relative_to(root / "python"), package
      assert vibeqc.__version__ == version, (vibeqc.__version__, version)
      if os.environ.get("VIBEQC_FULL_VALIDATION") == "1" or os.environ.get("CI_COMMIT_BRANCH", "").startswith("release-candidate/"):
          newest = max(p.stat().st_mtime for p in (root / "cpp").rglob("*") if p.is_file())
          assert core.stat().st_mtime >= newest, "compiled core predates source"
          assert os.environ.get("CCACHE_DISABLE") == "1"
          assert os.environ["SKBUILD_BUILD_DIR"] == str(root / "build-clean" / os.environ["CI_PIPELINE_ID"])
      with core.open("rb") as stream:
          core_hash = hashlib.file_digest(stream, "sha256").hexdigest()
      evidence = dict(source_sha=sha, version=version, python=sys.executable,
                      package=str(package), core=str(core), core_sha256=core_hash,
                      build_dir=os.environ.get("SKBUILD_BUILD_DIR"),
                      ccache_disabled=os.environ.get("CCACHE_DISABLE"),
                      stale_core_override=False, libraries=library_versions())
      target = root / "test-results" / "native-runtime.json"
      target.parent.mkdir(exist_ok=True)
      if os.environ.get("VIBEQC_FULL_VALIDATION") == "1" or os.environ.get("CI_COMMIT_BRANCH", "").startswith("release-candidate/"):
          artifact = target.parent / "native-core"
          artifact.mkdir(exist_ok=True)
          saved_core = artifact / core.name
          shutil.copy2(core, saved_core)
          with saved_core.open("rb") as stream:
              assert hashlib.file_digest(stream, "sha256").hexdigest() == core_hash
          shutil.copy2(Path(os.environ["SKBUILD_BUILD_DIR"]) / "CMakeCache.txt", artifact / "CMakeCache.txt")
          evidence["core_artifact"] = str(saved_core.relative_to(root))
          evidence["python_version"] = sys.version
          evidence["native_source_tree"] = subprocess.check_output(["git", "rev-parse", "HEAD:cpp"], text=True).strip()
          evidence["linked_dependency_paths"] = subprocess.check_output(["ldd", str(core)], text=True)
          dependency_paths = {word for word in evidence["linked_dependency_paths"].split()
                              if word.startswith("/") and Path(word).is_file()}
          dependency_paths.add(sys.executable)
          evidence["dependency_sha256"] = {}
          for path in sorted(dependency_paths):
              with Path(path).open("rb") as stream:
                  evidence["dependency_sha256"][path] = hashlib.file_digest(stream, "sha256").hexdigest()
          evidence["basis_data_path"] = os.environ.get("LIBINT_DATA_PATH")
          evidence["artifact_scope"] = "Core and build receipt only; qualify dependencies and interpreter before reuse."
      target.write_text(json.dumps(evidence, indent=2) + "\n")
      print(target.read_text())
      PY
    - cmake -S tests/native -B build-native-regressions -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CI_PROJECT_DIR/third_party/libint/install"
    - cmake --build build-native-regressions --parallel 2
    - ctest --test-dir build-native-regressions --output-on-failure
    - >-
      if [ "${VIBEQC_FULL_VALIDATION:-0}" = 1 ] || printf '%s' "${CI_COMMIT_BRANCH:-}" | grep -Eq '^release-candidate/';
      then
      .venv/bin/python scripts/test_gate/run_full_suite.py --wt . --py .venv/bin/python --tier T1 --out blocking.jsonl &&
      .venv/bin/python scripts/test_gate/gate_verdict.py blocking.jsonl scripts/test_gate/known_reds_baseline.json --wt . --py .venv/bin/python &&
      git fetch --no-tags origin "refs/tags/$VIBEQC_RELEASE_BASE:refs/tags/$VIBEQC_RELEASE_BASE" &&
      .venv/bin/python scripts/test_gate/run_full_suite.py --wt .
      --changed-since "${VIBEQC_RELEASE_BASE:?candidate requires VIBEQC_RELEASE_BASE}"
      --impact-mode release --list-affected-lanes &&
      .venv/bin/python scripts/test_gate/run_full_suite.py --wt .
      --changed-since "$VIBEQC_RELEASE_BASE" --impact-mode release --dry-run;
      else
      echo "regression pytest deferred: ordinary main push uses compile/import T0";
      fi;
    - >-
      if [ "${VIBEQC_FULL_VALIDATION:-0}" = 1 ] || printf '%s' "${CI_COMMIT_BRANCH:-}" | grep -Eq '^release-candidate/';
      then
      apt-get -qq install -y --no-install-recommends
      libgl1 libglx-mesa0 libxrender1 libxext6 libsm6 libglib2.0-0
      util-linux xvfb xauth &&
      git clone --depth 1 --branch "$VIBE_VIEW_TAG"
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_NAMESPACE}/vibe-view.git"
      /tmp/vibe-view &&
      .venv/bin/pip install -e '/tmp/vibe-view[test]' &&
      useradd --no-create-home --uid 10002 --user-group vvtest &&
      install -d -m 0700 -o vvtest -g vvtest "/tmp/vvtest-$CI_JOB_ID" &&
      install -d -m 0755 -o vvtest -g vvtest "$CI_PROJECT_DIR/test-results" &&
      chown -R vvtest:vvtest /tmp/vibe-view &&
      runuser -u vvtest -- env HOME="/tmp/vvtest-$CI_JOB_ID"
      git config --global --add safe.directory "$CI_PROJECT_DIR" &&
      runuser -u vvtest -- env HOME="/tmp/vvtest-$CI_JOB_ID"
      PYTHONPYCACHEPREFIX="/tmp/vvtest-$CI_JOB_ID/pycache"
      PIP_CACHE_DIR="/tmp/vvtest-$CI_JOB_ID/pip-cache"
      VIBEQC_RELOCALIZE_PYTHON="$CI_PROJECT_DIR/.venv/bin/python"
      PYVISTA_OFF_SCREEN=True sh -c 'test "$(id -u)" -ne 0 &&
      .venv/bin/python -c "import vibeqc; import vibeqc._vibeqc_core; import vibeqc_relocalize" &&
      exec xvfb-run -a .venv/bin/python -m pytest -q -ra -p no:cacheprovider
      --junitxml="$CI_PROJECT_DIR/test-results/viewer-contract.xml"
      /tmp/vibe-view/tests/test_container_submission.py
      /tmp/vibe-view/tests/test_details_panel_sandbox.py
      /tmp/vibe-view/tests/test_in_memory_handover.py
      /tmp/vibe-view/tests/test_job_container_lifecycle.py
      /tmp/vibe-view/tests/test_kind_drift.py
      /tmp/vibe-view/tests/test_live_opt.py
      /tmp/vibe-view/tests/test_wavefunction_libint_parity.py
      /tmp/vibe-view/tests/test_relocalize.py
      /tmp/vibe-view/tests/test_wavefunction_gradient.py
      /tmp/vibe-view/tests/test_manifest_root_blocks.py
      /tmp/vibe-view/tests/test_plot_renderers.py
      /tmp/vibe-view/tests/test_controller_state.py::test_vq_submit_job_container_mode_sends_a_pending_qvf';
      else
      echo "producer/consumer contract deferred: ordinary main push uses compile/import T0";
      fi;
  rules:
    - if: '$VIBEQC_FULL_VALIDATION == "1"'
    - if: '$CI_COMMIT_BRANCH =~ /^release-candidate\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $VIBEQC_BUILD_NATIVE == "1"'
      changes: &native_paths
        - "CMakeLists.txt"
        - "MANIFEST.in"
        - "pyproject.toml"
        - "cpp/**/*"
        - "tests/native/**/*"
        - "tests/test_trah_noncanonical.cpp"
        - "scripts/_build_lock.sh"
        - "scripts/_lifecycle_lock.sh"
        - "scripts/_safe_build_env.sh"
        - "scripts/_setup_helpers.sh"
        - "scripts/_venv_helpers.sh"
        - "scripts/build_*.sh"
        - "scripts/gen_qvf_v2_schema.py"
        - "scripts/install.sh"
        - "scripts/setup_basis_library.sh"
        - "scripts/setup_native_deps.sh"
        - "scripts/update.sh"
        - "scripts/update_native_deps.sh"

vibe-basis-test:
  interruptible: true
  stage: test
  image: python:3.13-slim-bookworm
  tags:
    - docker
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    - key: pip-vibe-basis-python313
      paths:
        - .cache/pip/
  before_script:
    - apt-get -qq update && apt-get -qq install -y --no-install-recommends
      git passwd util-linux
    - useradd --no-create-home --uid 10003 --user-group vbtest
    - install -d -m 0700 -o vbtest -g vbtest "/tmp/vbtest-$CI_JOB_ID"
    - chown vbtest:vbtest "$CI_PROJECT_DIR"
    - >-
      runuser -u vbtest -- env HOME="/tmp/vbtest-$CI_JOB_ID"
      git config --global --add safe.directory "$CI_PROJECT_DIR"
    - pip install -e 'vibe-basis[test]'
  script:
    - >-
      runuser -u vbtest -- env HOME="/tmp/vbtest-$CI_JOB_ID"
      PYTHONPYCACHEPREFIX="/tmp/vbtest-$CI_JOB_ID/pycache"
      PIP_CACHE_DIR="/tmp/vbtest-$CI_JOB_ID/pip-cache"
      python -m pytest "$CI_PROJECT_DIR/vibe-basis/tests"
      -q -p no:cacheprovider
    - >-
      runuser -u vbtest -- env HOME="/tmp/vbtest-$CI_JOB_ID"
      PIP_CACHE_DIR="/tmp/vbtest-$CI_JOB_ID/pip-cache"
      "$CI_PROJECT_DIR/vibe-basis/scripts/install.sh"
      --extras core --python "$(command -v python3)"
      --venv "/tmp/vbtest-$CI_JOB_ID/venv"
    - >-
      runuser -u vbtest -- env HOME="/tmp/vbtest-$CI_JOB_ID"
      PIP_CACHE_DIR="/tmp/vbtest-$CI_JOB_ID/pip-cache"
      "$CI_PROJECT_DIR/vibe-basis/scripts/update.sh"
      --skip-git --venv "/tmp/vbtest-$CI_JOB_ID/venv"
    - >-
      runuser -u vbtest -- env HOME="/tmp/vbtest-$CI_JOB_ID"
      PIP_CACHE_DIR="/tmp/vbtest-$CI_JOB_ID/pip-cache"
      "$CI_PROJECT_DIR/vibe-basis/scripts/reinstall.sh"
      --venv "/tmp/vbtest-$CI_JOB_ID/venv"
    - >-
      runuser -u vbtest -- env HOME="/tmp/vbtest-$CI_JOB_ID"
      "$CI_PROJECT_DIR/vibe-basis/scripts/uninstall.sh"
      --venv "/tmp/vbtest-$CI_JOB_ID/venv"
    - test ! -e "/tmp/vbtest-$CI_JOB_ID/venv"
  rules:
    - if: '$VIBEQC_FULL_VALIDATION == "1"'
    - if: '$CI_COMMIT_BRANCH =~ /^release-candidate\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &vibe_basis_paths
        - "pyproject.toml"
        - "scripts/_build_lock.sh"
        - "scripts/_lifecycle_lock.sh"
        - "vibe-basis/**/*"

docs-build:
  interruptible: true
  stage: build
  needs: ["source-privacy"]
  image: python:3.13-slim-bookworm
  tags:
    - docker
    - sphinx
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip/
  before_script:
    - apt-get -qq update && apt-get -qq install -y --no-install-recommends git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python -V
    - pip install --quiet
      'sphinx>=7.4'
      'myst-parser>=4.0'
      'linkify-it-py>=2'
      'furo>=2024.5'
      'sphinx-copybutton>=0.5'
      'sphinx-design>=0.6'
      'sphinx-reredirects>=0.1'
      'numpy>=1.26'
      'ase>=3.22'
      'dftd3>=1.2'
  script:
    - bash scripts/build_site.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
    - if: '$CI_COMMIT_BRANCH =~ /^release-candidate\//'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &docs_paths
        - ".gitlab-ci.yml"
        - "docs/conf.py"
        - "docs/Makefile"
        - "docs/_static/**/*"
        - "docs/_templates/**/*"
        - "scripts/build_site.sh"


website-test:
  interruptible: true
  stage: test
  needs: ["source-privacy"]
  image: node:22-slim
  tags:
    - docker
    - sphinx
  script:
    - npm --prefix website ci
    - PREVIEW_BASE=/preview/ npm --prefix website run verify
    - npm --prefix website run verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *website_paths
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'

changelog-audit:
  stage: test
  image: python:3.13-slim-bookworm
  tags:
    - docker
  variables:
    # audit compares each pin with the same section at its own git tag, so the
    # candidate's clone must carry them; a shallow clone audits nothing (#371).
    GIT_DEPTH: 0
  before_script:
    - apt-get -qq update && apt-get -qq install -y --no-install-recommends git
    - git fetch --tags --quiet || true
  script:
    - python scripts/test_gate/changelog_guard.py check
    - python scripts/test_gate/changelog_guard.py audit --require-tagged 1
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release-candidate\//'

qvf-conformance:
  interruptible: true
  stage: test
  image: python:3.13-slim-bookworm
  tags:
    - docker
  before_script:
    - apt-get -qq update && apt-get -qq install -y --no-install-recommends git
    - git clone --depth 1 --branch "$QVF_TAG"
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_NAMESPACE}/qvf.git"
      /tmp/qvf
  script:
    - python scripts/ci/check_qvf_schema.py --qvf-root /tmp/qvf
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release-candidate\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &qvf_paths
        - ".gitlab-ci.yml"
        - "scripts/ci/check_qvf_schema.py"
        - "scripts/gen_qvf_v2_schema.py"
        - "python/vibeqc/output/formats/*schema*.json"
    - if: '$CI_PIPELINE_SOURCE == "web"'
