# vibe-qc.com — legacy documentation-URL redirects
# ===================================================================
# WHY THIS FILE EXISTS
#
# The documentation used to be served at the domain ROOT
# (https://vibe-qc.com/quickstart.html, /installation.html, /_static/…).
# It has moved under /docs/ so the Astro marketing site (../website/)
# can own the root. These rules 301-redirect the old root URLs to their
# new /docs/ location so bookmarks, papers, and search-index links keep
# resolving.
#
# HOW IT IS APPLIED  (manual, one-time — NOT deployed by CI)
#
# The CI rsync deploys deliberately EXCLUDE `.htaccess` (see
# .gitlab-ci.yml), so this repo never overwrites the live root
# `.htaccess`. Paste the block below into `/web/.htaccess` on the
# server (example-web-account@vibe-qc.com), inside the existing `<IfModule
# mod_rewrite.c>` if there is one, ABOVE any catch-all rules.
#
# SEQUENCING — IMPORTANT
#
# Add these rules BEFORE (or in the same maintenance window as) the
# first `release` deploy that carries the /docs/ move. That deploy's
# `--delete-after` removes the old root doc files; until the rules are
# live, old URLs will 404 in the gap.
# ===================================================================

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Never touch the docs tree itself or the desktop update feed.
    RewriteCond %{REQUEST_URI} !^/docs/
    RewriteCond %{REQUEST_URI} !^/updates/

    # Only redirect paths that no longer exist at the root. Marketing
    # files that DO exist here (index.html, assets) fail these
    # conditions and are served normally; old doc pages were removed by
    # the deploy, so they match and get redirected.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d

    # Old Sphinx pages: any *.html at the root or in a section subdir.
    RewriteRule ^(.+\.html)$ /docs/$1 [R=301,L]

    # Sphinx asset trees moved under /docs/ as well.
    RewriteRule ^(_static|_images|_downloads)/(.*)$ /docs/$1/$2 [R=301,L]
</IfModule>
